<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f7fb">
<title>Tính điểm NVQS - BV Đa khoa Lãnh Binh Thăng</title>
<style>
:root{
  --bg:#f5f7fb; --card:#fff; --ink:#1e293b; --mute:#64748b; --line:#e2e8f0; --soft:#f1f5f9;
  --accent:#0d9488; --accent2:#059669; --accent-soft:#ecfdf5; --accent-ink:#0f766e;
  --ok:#16a34a; --s4:#f59e0b; --s5:#f97316; --s6:#ef4444;
  --r:14px; --shadow:0 1px 2px rgba(15,23,42,.04),0 4px 14px rgba(15,23,42,.05);
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg);color:var(--ink);font-weight:600;font-size:14px;line-height:1.35;
  min-height:100vh;display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}


main{flex:1;width:100%;max-width:980px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 10px) 12px 76px;display:flex;flex-direction:column;gap:10px}

/* Search: thẻ nổi mở mượt */
.sw{position:sticky;top:calc(env(safe-area-inset-top) + 8px);height:44px;z-index:40}
.scard{position:absolute;left:0;right:0;top:0;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);transition:box-shadow .3s var(--ease),border-color .3s,transform .3s var(--ease)}
.sw.open .scard{border-color:var(--accent);box-shadow:0 16px 40px rgba(15,23,42,.18);transform:translateY(-2px)}
.sbox{position:relative;height:41px}
.sbox svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--mute);pointer-events:none}
.sbox input{width:100%;height:100%;border:0;border-radius:var(--r);padding:0 40px 0 38px;font-size:15px;font-weight:700;outline:none;background:transparent}
.sbox input{-webkit-appearance:none;appearance:none}
.sbox input::-webkit-search-cancel-button,.sbox input::-webkit-search-decoration{-webkit-appearance:none;display:none}
.sbox .clr{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:31px;height:31px;border-radius:8px;font-size:18px;color:var(--mute);background:var(--soft)}
.panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s var(--ease)}
.sw.open .panel{grid-template-rows:1fr}
.panel>div{overflow:hidden;min-height:0}
.pin{border-top:1px solid var(--line);max-height:min(68vh,560px);overflow:auto;-webkit-overflow-scrolling:touch;padding:8px;
  opacity:0;transform:translateY(-6px);transition:opacity .25s,transform .32s var(--ease)}
.sw.open .pin{opacity:1;transform:none}
.shint{font-size:11.5px;color:var(--mute);padding:2px 4px 6px}
.shint b{color:var(--accent-ink)}
.sres{display:flex;flex-direction:column;gap:6px}
.backdrop{position:fixed;inset:0;background:rgba(15,23,42,.25);opacity:0;pointer-events:none;transition:opacity .3s;z-index:35}
.backdrop.on{opacity:1;pointer-events:auto}
.item{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ihead{display:flex;align-items:center;gap:7px;padding:6px 9px;background:var(--soft)}
.tt{min-width:30px;height:22px;border-radius:6px;background:var(--accent);color:#fff;font-size:11.5px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;padding:0 5px;flex:none}
.ihead .nm{font-weight:900;font-size:13px;flex:1;min-width:0}
.ihead .sec{font-size:10px;font-weight:800;color:var(--accent-ink);background:var(--accent-soft);border-radius:999px;padding:2px 7px;white-space:nowrap;flex:none}
.leaf{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 9px;border-top:1px solid var(--line)}
.leaf .lt{min-width:0}
.leaf .lt small{display:block;font-size:10.5px;color:var(--mute);font-weight:700}
.leaf .lt span{font-size:12.5px;font-weight:700}
mark{background:#fef08a;color:inherit;border-radius:3px;padding:0 1px}
.sc{min-width:32px;height:26px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;font-weight:900;color:#fff;padding:0 6px;font-size:13px;flex:none;white-space:nowrap}
.sc.txt{background:#e0f2fe;color:#075985;font-size:10.5px;white-space:normal;text-align:center;max-width:120px;height:auto;min-height:26px;padding:3px 6px;line-height:1.2}
.more,.noresult{font-size:12px;color:var(--mute);text-align:center;padding:6px}

/* Nhập liệu */
.calc{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@media(min-width:760px){.calc{grid-template-columns:1fr 1fr;align-items:start}}
.card{border:1.5px solid var(--line);border-radius:var(--r);padding:10px 12px 14px;background:var(--card);box-shadow:var(--shadow)}
.ch{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;min-height:36px}
.ch h3{display:flex;align-items:center;gap:8px;font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:900;color:var(--accent-ink)}
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);background:var(--soft);border-radius:10px;padding:3px;gap:3px}
.seg button{position:relative;z-index:1;min-height:30px;padding:6px 10px;border-radius:8px;font-weight:800;font-size:12.5px;color:var(--mute);line-height:1.15;transition:color .28s var(--ease),transform .15s var(--ease)}
.seg button.on{color:#fff}
.seg button:active{transform:scale(.95)}
/* Viên trượt của nút chọn */
.thumb{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px - (var(--n) - 1)*3px)/var(--n));border-radius:8px;
  background:linear-gradient(120deg,var(--accent),var(--accent2));box-shadow:0 2px 8px rgba(15,23,42,.15);
  transform:translateX(calc(var(--i)*(100% + 3px)));transition:transform .36s var(--ease)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px 10px;align-items:start}
.field{min-width:0;transition:opacity .28s var(--ease),transform .36s var(--ease)}
.field.off{opacity:0;transform:scale(.94);pointer-events:none}
.lr{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:4px;min-height:22px}
.lr label{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--mute)}
/* Stepper liền khối: [-] giá trị + đơn vị [+] */
.unit{display:flex;align-items:stretch;height:46px;border:1.5px solid var(--line);border-radius:10px;background:#fff;overflow:hidden;
  transition:border-color .15s,box-shadow .15s}
.unit:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.mid{position:relative;flex:1;min-width:0}
.unit input,.ro{display:block;width:100%;height:100%;border:0;border-radius:0;padding:0 2px 13px;text-align:center;font-size:19px;font-weight:900;line-height:31px;outline:none;background:transparent}
.unit input::placeholder{color:#94a3b8}
.mid span{position:absolute;left:0;right:0;bottom:5px;text-align:center;font-size:9.5px;font-weight:800;line-height:1;color:var(--mute);pointer-events:none}
.stp{flex:none;width:34px;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:800;line-height:1;color:var(--accent-ink);background:var(--soft);
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;transition:background .12s,color .12s}
.stp:first-child{border-right:1.5px solid var(--line)}
.stp:last-child{border-left:1.5px solid var(--line)}
.stp:active,.stp.hold{background:var(--accent);color:#fff}
.ro{color:var(--ink)}
.ro.empty{color:#94a3b8}
/* Thẻ BMI: tách riêng, không tính vào điểm Thể lực */
.bmi{min-height:72px;padding:3px 8px 6px;border:1.5px solid var(--line);border-radius:10px;background:#dfe7f0}
.bmi .lr{margin-bottom:0}
.bmi .lr label{color:#475569}
.bmi .chip{background:#c3ced9!important;color:#64748b!important}
.bmiv{display:flex;align-items:baseline;justify-content:center;gap:5px;height:38px;line-height:38px;font-size:19px;font-weight:900}
.bmiv small{font-size:9.5px;font-weight:800;color:var(--mute)}
.bmiv .ro{display:inline;width:auto;height:auto;padding:0;line-height:inherit}
.bmi .sub{margin-top:0}
/* Ghi chú mạch nằm ô bên phải cho cân lưới */
.note{align-self:stretch;display:flex;align-items:center;padding-top:26px;min-height:72px}
.note .sub{margin:0}
.sub{animation:fadeUp .28s var(--ease);font-size:11px;color:var(--accent-ink);font-weight:700;margin-top:3px;line-height:1.3}
.sub:empty{display:none}
.sub.warn{color:#c2410c}
.chip{min-width:26px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-weight:900;color:#fff;padding:0 6px;font-size:12.5px;flex:none;
  transform:scale(1);transition:transform .2s var(--ease),background .2s}
.chip.pop{animation:pop .3s var(--ease)}
@keyframes fadeUp{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.c1,.c2,.c3{background:var(--ok)!important}.c4{background:var(--s4)!important}.c5{background:var(--s5)!important}.c6{background:var(--s6)!important}
.c0{background:#e2e8f0;color:#94a3b8}
.cM{background:#7c3aed}

.subopt{display:grid;grid-template-rows:0fr;opacity:0;margin-top:0;transition:grid-template-rows .34s var(--ease),opacity .28s,margin-top .34s var(--ease)}
.subopt.show{grid-template-rows:1fr;opacity:1;margin-top:8px}
.subopt>div{overflow:hidden;min-height:0}
.subopt .lbl{font-size:11px;font-weight:800;color:var(--mute);margin-bottom:4px}

footer{padding:12px 72px calc(12px + env(safe-area-inset-bottom));text-align:center;border-top:1px solid var(--line);background:var(--card)}
footer p{line-height:1.6;font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}

/* Điểm kết luận cạnh tên thẻ */
.hsc{min-width:30px;height:26px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;color:#fff;padding:0 7px;letter-spacing:0}
.hsc.c0{background:#e2e8f0;color:#94a3b8}
.hsc{transition:background .25s}
.hsc.pop{animation:pop .3s var(--ease)}
/* Nút làm lại ở đáy */
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:30;width:48px;height:48px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 22px rgba(13,148,136,.4);transition:transform .2s var(--ease)}
.fab svg{width:22px;height:22px;transition:transform .45s var(--ease)}
.fab:active{transform:scale(.92)}
.fab.spin svg{transform:rotate(-360deg)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>



<div class="backdrop" id="backdrop"></div>
<button class="fab" id="resetBtn" aria-label="Làm lại" title="Làm lại">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
</button>

<main>
  <!-- TRA CỨU BỆNH -->
  <div class="sw" id="sw">
    <div class="scard" id="scard">
      <div class="sbox">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" name="search" role="searchbox" aria-label="Tìm nhanh" placeholder="Tìm nhanh" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" data-form-type="other" data-lpignore="true" data-1p-ignore data-bwignore>
        <button class="clr" id="qClr" aria-label="Xóa" hidden>×</button>
      </div>
      <div class="panel"><div><div class="pin">
        <div class="shint">Phụ lục I, TT 88/VBHN-BQP. Gõ không dấu cũng được. <b>T</b> = bệnh tạm thời.</div>
        <div class="sres" id="qRes"></div>
      </div></div></div>
    </div>
  </div>

  <!-- THỂ LỰC + HA, MẠCH -->
  <section class="calc">
    <div class="card">
      <div class="ch">
        <h3>Thể lực <b class="hsc" id="hTL">--</b></h3>
        <div class="seg" id="segSex" data-value="m">
          <button data-v="m" class="on">Nam</button>
          <button data-v="f">Nữ</button>
        </div>
      </div>
      <div class="grid2">
        <div class="field"><div class="lr"><label for="h">Chiều cao</label><span class="chip c0" id="sH">--</span></div>
          <div class="unit"><button type="button" class="stp" data-for="h" data-d="-1" aria-label="Giảm" tabindex="-1">−</button><div class="mid"><input id="h" autocomplete="off" data-form-type="other" data-lpignore="true" data-1p-ignore inputmode="decimal" placeholder="--"><span>cm</span></div><button type="button" class="stp" data-for="h" data-d="1" aria-label="Tăng" tabindex="-1">+</button></div>
          <div class="sub" id="hSub"></div></div>
        <div class="field"><div class="lr"><label for="w">Cân nặng</label><span class="chip c0" id="sW">--</span></div>
          <div class="unit"><button type="button" class="stp" data-for="w" data-d="-1" aria-label="Giảm" tabindex="-1">−</button><div class="mid"><input id="w" autocomplete="off" data-form-type="other" data-lpignore="true" data-1p-ignore inputmode="decimal" placeholder="--"><span>kg</span></div><button type="button" class="stp" data-for="w" data-d="1" aria-label="Tăng" tabindex="-1">+</button></div>
          <div class="sub" id="wSub"></div></div>
        <div class="field" id="chestField"><div class="lr"><label for="ch">Vòng ngực</label><span class="chip c0" id="sC">--</span></div>
          <div class="unit"><button type="button" class="stp" data-for="ch" data-d="-1" aria-label="Giảm" tabindex="-1">−</button><div class="mid"><input id="ch" autocomplete="off" data-form-type="other" data-lpignore="true" data-1p-ignore inputmode="decimal" placeholder="--"><span>cm</span></div><button type="button" class="stp" data-for="ch" data-d="1" aria-label="Tăng" tabindex="-1">+</button></div>
          <div class="sub" id="chSub"></div></div>
        <div class="field bmi" id="bmiField"><div class="lr"><label>BMI</label><span class="chip c0" id="sB">--</span></div>
          <div class="bmiv"><span class="ro empty" id="bmiV">--</span><small>kg/m²</small></div>
          <div class="sub" id="bmiSub"></div></div>
      </div>
    </div>

    <div class="card">
      <div class="ch"><h3>Huyết áp, mạch <b class="hsc" id="hNK">--</b></h3></div>
      <div class="grid2">
        <div class="field"><div class="lr"><label for="sys">HA tâm thu</label><span class="chip c0" id="sS">--</span></div>
          <div class="unit"><button type="button" class="stp" data-for="sys" data-d="-1" aria-label="Giảm" tabindex="-1">−</button><div class="mid"><input id="sys" autocomplete="off" data-form-type="other" data-lpignore="true" data-1p-ignore inputmode="numeric" placeholder="--"><span>mmHg</span></div><button type="button" class="stp" data-for="sys" data-d="1" aria-label="Tăng" tabindex="-1">+</button></div></div>
        <div class="field"><div class="lr"><label for="dia">HA tâm trương</label><span class="chip c0" id="sD">--</span></div>
          <div class="unit"><button type="button" class="stp" data-for="dia" data-d="-1" aria-label="Giảm" tabindex="-1">−</button><div class="mid"><input id="dia" autocomplete="off" data-form-type="other" data-lpignore="true" data-1p-ignore inputmode="numeric" placeholder="--"><span>mmHg</span></div><button type="button" class="stp" data-for="dia" data-d="1" aria-label="Tăng" tabindex="-1">+</button></div></div>
        <div class="field"><div class="lr"><label for="pulse">Mạch</label><span class="chip c0" id="sP">--</span></div>
          <div class="unit"><button type="button" class="stp" data-for="pulse" data-d="-1" aria-label="Giảm" tabindex="-1">−</button><div class="mid"><input id="pulse" autocomplete="off" data-form-type="other" data-lpignore="true" data-1p-ignore inputmode="numeric" placeholder="--"><span>l/ph</span></div><button type="button" class="stp" data-for="pulse" data-d="1" aria-label="Tăng" tabindex="-1">+</button></div></div>
        <div class="field note"><div class="sub" id="pSub"></div></div>
      </div>
      <div class="subopt" id="lianWrap" inert><div>
        <div class="lbl">Mạch 50-54: nghiệm pháp Lian</div>
        <div class="seg" id="segLian" data-value="none">
          <button data-v="none" class="on">Chưa làm</button>
          <button data-v="good">Bình thường</button>
          <button data-v="bad">Xấu</button>
        </div>
      </div></div>
      <div class="subopt" id="sevWrap" inert><div>
        <div class="lbl">Mạch ≥ 100 hoặc &lt; 50: bác sĩ chọn điểm</div>
        <div class="seg" id="segSev" data-value="5">
          <button data-v="5" class="on">Điểm 5</button>
          <button data-v="6">Điểm 6</button>
        </div>
      </div></div>
    </div>
  </section>
</main>

<footer>
  <p>Phòng Kế hoạch tổng hợp<br>BV Đa khoa Lãnh Binh Thăng</p>
</footer>

<!--
  DỮ LIỆU BỆNH TẬT - Phụ lục I, mục II và III (TT 88/VBHN-BQP, theo Phu luc.doc)
  Đã bỏ mục 1 (thị lực), 30 (sức nghe), 99 (HA), 101 (mạch).
  Cú pháp:  #Tên nhóm  |  TT|Tên mục|Điểm  |  -Mức 1|Điểm  |  +Mức 2|Điểm  |  *Mức 3|Điểm
-->
<script type="text/plain" id="db">
#Mắt
2|Cận thị|
-Cận thị dưới -3D|Theo mục 1.2
-Cận thị từ -3D đến dưới -4D|4
-Cận thị từ -4D đến dưới -5D|5
-Cận thị từ -5D trở lên|6
-Cận thị đã phẫu thuật|Theo mục 1.1, tăng 1 điểm
3|Viễn thị|
-Viễn thị dưới +1,5D|Theo mục 1.1
-Viễn thị từ +1,5D đến dưới +3D|4
-Viễn thị từ +3D đến dưới +4D|5
-Viễn thị từ +4D đến dưới +5D|6
-Viễn thị đã phẫu thuật|Theo mục 1.1, tăng 1 điểm
4|Loạn thị|
-Loạn thị sinh lý hoặc < 1D|2
-Loạn thị ≥ 1D|3
-Loạn thị đã phẫu thuật, hết loạn thị|Theo mục 1.1, tăng 1 điểm
5|Mộng thịt|
-Mộng thịt độ 1, độ 2|2
-Mộng thịt độ 3|4
-Mộng thịt độ 4|5
-Mộng thịt đã mổ tái phát, gây dính|5
6|Bệnh giác mạc|
-Sẹo giác mạc đơn thuần, mỏng, nhỏ ở ngoài vùng trung tâm|Theo mục 1.1, tăng 1 điểm
-Sẹo giác mạc có dính mống mắt|6
-Viêm giác mạc|
+Nhẹ|3T
+Vừa|4T
7|Quặm và lông siêu ở mi mắt|
-Không ảnh hưởng đến thị lực|2
-Có ảnh hưởng đến thị lực|Theo mục 1.1, tăng 1 điểm
8|Viêm kết mạc|
-Viêm kết mạc cấp|2T
-Viêm kết mạc mùa xuân|4
9|Lệ đạo|
-Viêm lệ đạo cấp tính|3T
-Viêm tắc lệ đạo mạn tính|
+Nếu ở 1 bên mắt|5
+Nếu ở 2 bên mắt|6
10|Vận nhãn|
-Lác cơ năng|
+Không gây giảm thị lực|3
+Có giảm thị lực (chỉnh kính tối đa thị lực ≤ 8/10)|5

<script>
/*SCORING-START*/
function roundHalfUp(x){ return Math.floor(x+0.5); }
function scoreHeight(h,sex){
  if(sex==='f') return h>=154?1 : h>=152?2 : h>=150?3 : h>=148?4 : h>=147?5 : 6;
  return h>=163?1 : h>=160?2 : h>=157?3 : h>=155?4 : h>=153?5 : 6;
}
function scoreWeight(w,sex){
  if(sex==='f') return w>=48?1 : w>=44?2 : w>=42?3 : w>=40?4 : w>=38?5 : 6;
  return w>=51?1 : w>=47?2 : w>=43?3 : w>=41?4 : w>=40?5 : 6;
}
function scoreChest(c){ return c>=81?1 : c>=78?2 : c>=75?3 : c>=73?4 : c>=71?5 : 6; }
function scoreBMI(b){
  if(b>=40) return 6; if(b>=35) return 5; if(b>=30) return 4;
  if(b>=27) return 3; if(b>=25) return 2; if(b>=18.5) return 1; return 4;
}
function scoreSys(s){
  if(s>=160) return 6; if(s>=150) return 5; if(s>=140 || s<90) return 4;
  if(s>=131 || s<100) return 3; if(s>=121 || s<110) return 2; return 1;
}
function scoreDia(d){ return d>=100?5 : d>=90?4 : d>=86?3 : d>=81?2 : 1; }
// Mục 101
function scorePulse(p, lian, sev){
  if(p>=100 || p<50) return {score:+sev, kind:'sev'};
  if(p>=91) return {score:4};
  if(p>=50 && p<=54){
    if(lian==='good') return {score:3, kind:'lian'};
    if(lian==='bad') return {score:4, kind:'lian'};
    return {score:4, kind:'lianPending'};
  }
  if(p>=86 || p<=56) return {score:3};
  if(p>=81 || p<=59) return {score:2};
  return {score:1};
}
/*SCORING-END*/

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
function parseNum(v){ if(v==null) return null; v=String(v).trim().replace(',', '.'); if(v===''||v==='+'||v==='-') return null; const n=parseFloat(v); return isNaN(n)?null:n; }
function num(id){ const n=parseNum($(id).value); return n!=null && n>0 ? n : null; }
function fmtVN(v){ return String(v).replace('.', ','); }
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ===== TRA CỨU BỆNH ===== */
function norm(s){ return s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'d').toLowerCase(); }
function low(s){ return s.normalize('NFC').toLowerCase(); }
function prep(s){ return ' '+s.replace(/[^\p{L}\p{N}.,]+/gu,' ')+' '; }
function hasMark(s){ return norm(s)!==low(s); }
function wordHit(hay, t){ return hay.includes(' '+t); }

const ITEMS = (()=>{
  const items=[]; let sec='', cur=null, stack=[];
  document.getElementById('db').textContent.split('\n').forEach(raw=>{
    const line=raw.trim(); if(!line) return;
    if(line[0]==='#'){ sec=line.slice(1).trim(); return; }
    const lvl = {'-':1,'+':2,'*':3}[line[0]] || 0;
    const parts = (lvl ? line.slice(1) : line).split('|');
    if(lvl===0){
      cur={sec, tt:parts[0].trim(), name:parts[1].trim(), leaves:[]};
      items.push(cur); stack=[];
      const sc=(parts[2]||'').trim();
      if(sc) cur.leaves.push({ctx:'', name:'', score:sc});
      return;
    }
    const name=parts[0].trim(), sc=(parts[1]||'').trim();
    stack.length = lvl-1; stack[lvl-1]=name;
    if(sc) cur.leaves.push({ctx:stack.slice(0,lvl-1).join(' › '), name, score:sc});
  });
  items.forEach(it=>{
    const h=`${it.tt} ${it.name} ${it.sec}`;
    it.hay={n:prep(norm(h)), d:prep(low(h))};
    it.leaves.forEach(l=>{ const t=`${l.ctx} ${l.name}`; l.hay={n:prep(norm(t)), d:prep(low(t))}; });
  });
  return items;
})();

function scoreHTML(s){
  if(s==='Miễn') return '<span class="sc cM">Miễn</span>';
  if(s==='?') return '<span class="sc c0" title="Văn bản không ghi điểm">--</span>';
  if(/^[\d\s,\-T]+$/.test(s)){
    const mx=Math.max(...(s.match(/\d/g)||[0]).map(Number));
    return `<span class="sc c${mx}">${esc(s.replace(/\s+/g,''))}</span>`;
  }
  return `<span class="sc txt">${esc(s)}</span>`;
}
let HLMODE='n';
function hl(text, toks){
  if(!toks.length) return esc(text);
  text=text.normalize('NFC');
  const n = HLMODE==='d' ? low(text) : norm(text);
  if(n.length!==text.length) return esc(text);
  const mark=new Array(text.length).fill(false);
  toks.forEach(t=>{ let i=n.indexOf(t); while(i>=0){ if(i===0 || !/[\p{L}\p{N}]/u.test(n[i-1])) for(let k=i;k<i+t.length;k++) mark[k]=true; i=n.indexOf(t,i+1); } });
  let out='', on=false;
  for(let i=0;i<text.length;i++){
    if(mark[i]&&!on){ out+='<mark>'; on=true; }
    if(!mark[i]&&on){ out+='</mark>'; on=false; }
    out+=esc(text[i]);
  }
  return out+(on?'</mark>':'');
}

const MAX_ITEMS=40;
function doSearch(){
  const qv=$('#q').value.trim();
  $('#qClr').hidden=!qv;
  const res=$('#qRes');
  if(!qv){ res.innerHTML=''; return; }
  const mode=hasMark(qv)?'d':'n';
  const toks=(mode==='d'?low(qv):norm(qv)).split(/[^\p{L}\p{N}.,]+/u).filter(Boolean);
  const isNum=/^m?\d+$/i.test(qv);
  const hits=[];
  ITEMS.forEach(it=>{
    if(isNum){ if(norm(it.tt)===norm(qv)) hits.push({it, leaves:it.leaves, rank:0}); return; }
    const H=it.hay[mode];
    if(toks.every(t=>wordHit(H,t))){ hits.push({it, leaves:it.leaves, rank:0}); return; }
    const ls=it.leaves.filter(l=>toks.every(t=>wordHit(H,t)||wordHit(l.hay[mode],t)));
    if(ls.length) hits.push({it, leaves:ls, rank:1});
  });
  hits.sort((a,b)=>a.rank-b.rank);
  HLMODE=mode;
  if(!hits.length){
    const inCalc = /^(99|101)$/.test(qv) || /^(huyet ap|mach)$/.test(norm(qv));
    res.innerHTML=`<div class="noresult">Không tìm thấy "${esc(qv)}".${inCalc?' HA (mục 99) và mạch (mục 101) chấm ở phần bên dưới.':' Thử từ khóa ngắn hơn hoặc không dấu.'}</div>`;
    return;
  }
  res.innerHTML = hits.slice(0,MAX_ITEMS).map(({it,leaves})=>{
    const direct = leaves.length===1 && !leaves[0].name;
    const head=`<div class="ihead"><span class="tt">${esc(it.tt)}</span><span class="nm">${hl(it.name,toks)}</span><span class="sec">${esc(it.sec)}</span>${direct?scoreHTML(leaves[0].score):''}</div>`;
    if(direct) return `<div class="item">${head}</div>`;
    return `<div class="item">${head}${leaves.map(l=>
      `<div class="leaf"><div class="lt">${l.ctx?`<small>${hl(l.ctx,toks)}</small>`:''}<span>${hl(l.name,toks)}</span></div>${scoreHTML(l.score)}</div>`).join('')}</div>`;
  }).join('') + (hits.length>MAX_ITEMS?`<div class="more">Còn ${hits.length-MAX_ITEMS} mục nữa, gõ cụ thể hơn.</div>`:'');
  $('.pin').scrollTop=0;
}

/* Mở / đóng thẻ tìm kiếm */
const sw=$('#sw'), bd=$('#backdrop');
function openS(){ if(!$('#q').value.trim()) return closeS(false); sw.classList.add('open'); bd.classList.add('on'); }
function closeS(blur=true){ sw.classList.remove('open'); bd.classList.remove('on'); if(blur) $('#q').blur(); }
$('#q').addEventListener('input', ()=>{ doSearch(); openS(); });
$('#q').addEventListener('focus', ()=>{ $('#q').value=''; doSearch(); closeS(false); });
$('#q').addEventListener('keydown', e=>{ if(e.key==='Escape') closeS(); if(e.key==='Enter') $('#q').blur(); });
$('#qClr').addEventListener('click', ()=>{ $('#q').value=''; doSearch(); closeS(false); $('#q').focus(); });
document.addEventListener('pointerdown', e=>{ if(sw.classList.contains('open') && !$('#scard').contains(e.target)) closeS(); });

/* ===== THỂ LỰC + HA, MẠCH ===== */
$$('.unit input').forEach(i=>i.addEventListener('input', recalc));
$$('.seg').forEach(seg=>{
  seg.querySelectorAll('button').forEach(b=>b.addEventListener('click', ()=>{
    setSeg('#'+seg.id, b.dataset.v);
    recalc();
  }));
});
/* Nút -/+ : bấm 1 lần = 1 bước, giữ để chạy nhanh. Ô trống -> điền giá trị khởi đầu */
const STEP={h:1,w:1,ch:1,sys:2,dia:2,pulse:1};
const START={h:160,w:50,ch:80,sys:120,dia:80,pulse:75};
function stepField(id, dir){
  const el=document.getElementById(id), st=STEP[id], v=parseNum(el.value);
  let n;
  if(v==null || v<=0) n=START[id];
  else n = dir>0 ? Math.floor(v/st+1e-9)*st+st : Math.ceil(v/st-1e-9)*st-st;   // số lẻ/thập phân -> về bội số của bước
  el.value=fmtVN(Math.min(Math.max(n,st),400));
  recalc();
}
$$('.stp').forEach(b=>{
  const id=b.dataset.for, dir=+b.dataset.d; let t=null, iv=null, held=false;
  const stop=()=>{ clearTimeout(t); clearInterval(iv); t=iv=null; b.classList.remove('hold'); };
  b.addEventListener('pointerdown', e=>{ if(e.button) return; held=false; stop();
    t=setTimeout(()=>{ held=true; b.classList.add('hold'); stepField(id,dir); iv=setInterval(()=>stepField(id,dir),90); },420); });
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev, stop));
  b.addEventListener('click', ()=>{ if(held){ held=false; return; } stepField(id,dir); });
  b.addEventListener('contextmenu', e=>e.preventDefault());
});

function setSeg(id, v){
  const seg=$(id), bs=[...seg.querySelectorAll('button')];
  seg.dataset.value=v; bs.forEach(x=>x.classList.toggle('on', x.dataset.v===v));
  seg.style.setProperty('--n', bs.length); seg.style.setProperty('--i', Math.max(0, bs.findIndex(x=>x.dataset.v===v)));
}
$$('.seg').forEach(seg=>{ const t=document.createElement('span'); t.className='thumb'; seg.prepend(t); setSeg('#'+seg.id, seg.dataset.value); });
function showOpt(id, on){ const el=$(id); el.classList.toggle('show', on); el.inert=!on; }

$('#resetBtn').addEventListener('click', ()=>{
  const fb=$('#resetBtn'); fb.classList.remove('spin'); void fb.offsetWidth; fb.classList.add('spin'); setTimeout(()=>fb.classList.remove('spin'),460);
  setSeg('#segSex','m'); setSeg('#segLian','none'); setSeg('#segSev','5');
  ['#h','#w','#ch','#sys','#dia','#pulse'].forEach(i=>$(i).value='');
  $('#q').value=''; doSearch(); closeS();
  recalc(); window.scrollTo({top:0,behavior:'smooth'});
});

function setChip(id, s){
  const el=$(id), txt=s==null?'--':String(s);
  if(el.textContent!==txt && s!=null){ el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
  el.className='chip c'+(s==null?0:s)+(el.classList.contains('pop')?' pop':'');
  el.textContent=txt;
}
function setHead(id, s){ const el=$(id), t=s==null?'--':String(s); if(el.textContent!==t && s!=null){ el.classList.remove('pop'); void el.offsetWidth; } el.textContent=t; el.className='hsc c'+(s==null?0:s)+(s!=null?' pop':''); }
function setSub(id, t, warn){ const el=$(id); el.textContent=t||''; el.classList.toggle('warn', !!warn); }

function recalc(){
  const sex=$('#segSex').dataset.value;
  const cf=$('#chestField'); cf.classList.toggle('off', sex==='f'); cf.inert = sex==='f';   // giữ chỗ để BMI không đổi vị trí
  const h=num('#h'), w=num('#w'), ch = sex==='m' ? num('#ch') : null;
  const phys=[];
  let hr=null, wr=null, s;

  if(h!=null){ hr=roundHalfUp(h); s=scoreHeight(hr,sex); phys.push(s); setChip('#sH',s); setSub('#hSub', hr!==h?`Làm tròn: ${hr} cm`:''); }
  else { setChip('#sH',null); setSub('#hSub',''); }
  if(w!=null){ wr=roundHalfUp(w); s=scoreWeight(wr,sex); phys.push(s); setChip('#sW',s); setSub('#wSub', wr!==w?`Làm tròn: ${wr} kg`:''); }
  else { setChip('#sW',null); setSub('#wSub',''); }
  if(ch!=null){ const cr=roundHalfUp(ch); s=scoreChest(cr); phys.push(s); setChip('#sC',s); setSub('#chSub', cr!==ch?`Làm tròn: ${cr} cm`:''); }
  else { setChip('#sC',null); setSub('#chSub', sex==='m' && (h!=null||w!=null) ? 'Cần nhập để đủ chỉ tiêu thể lực' : '', true); }

  const bv=$('#bmiV');
  if(hr && wr){
    const bmi=Math.round(wr/Math.pow(hr/100,2)*10)/10; s=scoreBMI(bmi);   // BMI chấm riêng, không đưa vào điểm Thể lực
    bv.textContent=fmtVN(bmi.toFixed(1)); bv.classList.remove('empty'); setChip('#sB',s);
    if(bmi<18.5){
      const minW=Math.ceil(18.5*Math.pow(hr/100,2) - 1e-9);
      setSub('#bmiSub', `Dưới 18,5. Cao ${hr} cm cần nặng ≥ ${minW} kg`, true);
    } else setSub('#bmiSub','');
  } else { bv.textContent='--'; bv.classList.add('empty'); setChip('#sB',null); setSub('#bmiSub',''); }

  // HA, mạch
  const sys=num('#sys'), dia=num('#dia'), pu=num('#pulse');
  const nk=[];
  if(sys!=null){ s=scoreSys(Math.round(sys)); nk.push(s); setChip('#sS',s); } else setChip('#sS',null);
  if(dia!=null){ s=scoreDia(Math.round(dia)); nk.push(s); setChip('#sD',s); } else setChip('#sD',null);
  let lianShow=false, sevShow=false; const pn=[]; let pw=false;
  if(pu!=null){
    const p=Math.round(pu);
    const r=scorePulse(p, $('#segLian').dataset.value, $('#segSev').dataset.value);
    nk.push(r.score); setChip('#sP',r.score);
    if(r.kind==='lianPending'){ pn.push('Tạm tính 4, chờ nghiệm pháp Lian'); pw=true; }
    if(p<50){ pn.push('Làm nghiệm pháp Atropin tại cơ sở có điều kiện'); pw=true; }
    if(p>=90) pn.push('≥ 90: khám chuyên khoa tim mạch, nội tiết');
    lianShow = p>=50 && p<=54; sevShow = p>=100 || p<50;
  } else setChip('#sP',null);
  setSub('#pSub', pn.join('. '), pw);
  showOpt('#lianWrap',lianShow); showOpt('#sevWrap',sevShow);

  setHead('#hTL', phys.length?Math.max(...phys):null);
  setHead('#hNK', nk.length?Math.max(...nk):null);
}
recalc();
</script>
</body>
</html>
